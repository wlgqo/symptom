server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: symptom-monitor
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${user.dir}/data/symptom.db
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.symptom.entity
  type-handlers-package: com.symptom.config
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.symptom: INFO
