<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 症候群监测管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-page">

    <section class="login-brand-panel">
        <div class="login-brand-inner">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M12 3v18"/>
                        <path d="M3 12h18"/>
                        <circle cx="12" cy="12" r="8"/>
                    </svg>
                </div>
                <div>
                    <div class="login-logo-title">症候群监测管理系统</div>
                    <div class="login-logo-subtitle">SYNDROMIC SURVEILLANCE MANAGEMENT SYSTEM</div>
                </div>
            </div>

            <div class="login-brand-main">
                <h1>公共卫生智能监测<br>与<span>风险预警平台</span></h1>
                <p>面向公共卫生监测业务，融合多源医疗数据，实现症状监测、症候群识别、趋势分析与风险预警，为疾病防控和公共卫生决策提供数据支撑。</p>
            </div>

            <div class="login-concept-list">
                <div class="login-concept"><span class="login-concept-dot"></span>症状监测</div>
                <div class="login-concept"><span class="login-concept-dot"></span>症候群分析</div>
                <div class="login-concept"><span class="login-concept-dot"></span>趋势研判</div>
                <div class="login-concept"><span class="login-concept-dot"></span>风险预警</div>
            </div>

            <div class="login-brand-slogan">
                <span class="login-brand-slogan-line"></span>
                <span>监测理念</span>
                <strong>早发现 · 早识别 · 早研判 · 早预警</strong>
            </div>
        </div>

        <div class="login-brand-footer">
            症候群监测管理系统 · 公共卫生智能监测与预警平台
        </div>
    </section>

    <section class="login-form-panel">
        <div class="login-form-box">
            <div class="login-form-header">
                <h2>欢迎登录</h2>
                <p>登录系统开展症候群监测与分析工作</p>
            </div>

            <div th:if="${error}" class="login-alert" th:text="${error}"></div>

            <form method="post" action="/login" class="login-form">
                <div class="login-field">
                    <label class="login-form-label" for="username">账号</label>
                    <div class="login-input-wrapper">
                        <span class="login-input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <circle cx="12" cy="8" r="4"/>
                                <path d="M4 21c1-4 3.5-6 8-6s7 2 8 6"/>
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" class="login-form-input"
                               placeholder="请输入账号" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="login-field">
                    <label class="login-form-label" for="password">密码</label>
                    <div class="login-input-wrapper">
                        <span class="login-input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <rect x="4" y="10" width="16" height="11" rx="2"/>
                                <path d="M8 10V7a4 4 0 018 0v3"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="login-form-input"
                               placeholder="请输入密码" required autocomplete="current-password">
                    </div>
                </div>

                <div class="login-options">
                    <label class="login-remember">
                        <input type="checkbox" name="remember">
                        <span>记住账号</span>
                    </label>
                    <span class="login-forget">忘记密码？</span>
                </div>

                <button type="submit" class="btn-login">登 录</button>

                <div class="login-security-tip">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M12 3l8 4v5c0 4.8-3.4 7.9-8 9-4.6-1.1-8-4.2-8-9V7l8-4z"/>
                        <path d="m8.5 12 2.3 2.3 4.7-5"/>
                    </svg>
                    数据安全加密传输
                </div>
            </form>
        </div>

        <div class="login-page-footer">© 2026 症候群监测管理系统</div>
    </section>
</div>
</body>
</html>
