<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('发热伴出血症候群重症死亡监测', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="workflow-bar">
        <div class="workflow-step active"><span class="step-num">1</span><span class="step-label">病例识别</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">2</span><span class="step-label">重症监测</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">3</span><span class="step-label">死亡统计</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">4</span><span class="step-label">原始病历</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">5</span><span class="step-label">预警模型</span></div>
    </div>

    <div class="quick-links">
        <a href="/case/list?syndromeType=发热伴出血症候群" class="quick-link">全部病例</a>
        <a href="/search" class="quick-link">主题库检索</a>
        <a href="/respiratory" class="quick-link">呼吸道监测</a>
    </div>

    <div class="card-panel" th:if="${syndromeConfig != null}">
        <h5>症候群识别规则 <span class="panel-action"><span class="badge-level badge-blue" th:text="${syndromeConfig.syndromeCode}"></span></span></h5>
        <p class="panel-desc" th:text="${syndromeConfig.definition}"></p>
    </div>

    <div class="stat-cards">
        <div class="stat-card clickable" onclick="location.href='/case/list?syndromeType=发热伴出血症候群'">
            <div class="label">病例总数</div>
            <div class="value" th:text="${stats.total}">0</div>
        </div>
        <div class="stat-card warning">
            <div class="label">重症病例</div>
            <div class="value" th:text="${stats.severe}">0</div>
        </div>
        <div class="stat-card danger">
            <div class="label">死亡病例</div>
            <div class="value" th:text="${stats.death}">0</div>
        </div>
        <div class="stat-card danger">
            <div class="label">重症率</div>
            <div class="value" th:text="${stats.severeRate + '%'}">0%</div>
        </div>
        <div class="stat-card danger">
            <div class="label">死亡率</div>
            <div class="value" th:text="${stats.deathRate + '%'}">0%</div>
        </div>
    </div>

    <div class="grid-2">
        <div class="card-panel">
            <h5>重症率时间变化趋势</h5>
            <div id="severeTrendChart" class="chart-container"></div>
        </div>
        <div class="card-panel">
            <h5>死亡率时间变化趋势</h5>
            <div id="deathTrendChart" class="chart-container"></div>
        </div>
    </div>

    <div class="grid-2">
        <div class="card-panel">
            <h5>重症患者列表</h5>
            <table class="data-table">
                <thead><tr><th>姓名</th><th>性别</th><th>年龄</th><th>诊断</th><th>地区</th><th>操作</th></tr></thead>
                <tbody>
                    <tr th:each="c : ${severeCases}">
                        <td th:text="${c.patientName}"></td>
                        <td th:text="${c.gender}"></td>
                        <td th:text="${c.age}"></td>
                        <td th:text="${c.diagnosis}"></td>
                        <td th:text="${c.district}"></td>
                        <td><a th:href="@{/case/detail/{id}(id=${c.id})}" class="table-link">原始病历</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-panel">
            <h5>死亡患者列表</h5>
            <table class="data-table">
                <thead><tr><th>姓名</th><th>性别</th><th>年龄</th><th>诊断</th><th>死亡日期</th><th>操作</th></tr></thead>
                <tbody>
                    <tr th:each="c : ${deathCases}">
                        <td th:text="${c.patientName}"></td>
                        <td th:text="${c.gender}"></td>
                        <td th:text="${c.age}"></td>
                        <td th:text="${c.diagnosis}"></td>
                        <td th:text="${c.deathDate != null ? #dates.format(c.deathDate, 'yyyy-MM-dd') : '-'}"></td>
                        <td><a th:href="@{/case/detail/{id}(id=${c.id})}" class="table-link">原始病历</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card-panel" th:if="${models != null and !models.isEmpty()}">
        <h5>监测与预警模型</h5>
        <table class="data-table">
            <thead><tr><th>模型名称</th><th>类型</th><th>参数配置</th><th>说明</th><th>状态</th></tr></thead>
            <tbody>
                <tr th:each="m : ${models}">
                    <td th:text="${m.modelName}"></td>
                    <td th:text="${m.modelType}"></td>
                    <td><code style="font-size:11px;" th:text="${m.configJson}"></code></td>
                    <td th:text="${m.description}"></td>
                    <td><span class="badge-level badge-low" th:text="${m.enabled == 1 ? '启用' : '禁用'}"></span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:inline="javascript">
        var stats = /*[[${stats}]]*/ {};
        var severeChart = echarts.init(document.getElementById('severeTrendChart'));
        severeChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: 50, right: 20, top: 30, bottom: 30 },
            xAxis: { type: 'category', data: (stats.severeTrend||[]).map(function(d){return d.month;}) },
            yAxis: { type: 'value', name: '重症率(%)' },
            series: [{ type: 'line', smooth: true, itemStyle: { color: '#faad14' }, areaStyle: { opacity: 0.06 },
                data: (stats.severeTrend||[]).map(function(d){return d.rate;}) }]
        });
        var deathChart = echarts.init(document.getElementById('deathTrendChart'));
        deathChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: 50, right: 20, top: 30, bottom: 30 },
            xAxis: { type: 'category', data: (stats.deathTrend||[]).map(function(d){return d.month;}) },
            yAxis: { type: 'value', name: '死亡率(%)' },
            series: [{ type: 'line', smooth: true, itemStyle: { color: '#ff4d4f' }, areaStyle: { opacity: 0.06 },
                data: (stats.deathTrend||[]).map(function(d){return d.rate;}) }]
        });
        window.addEventListener('resize', function(){ severeChart.resize(); deathChart.resize(); });
    </script>
</div>
</body>
</html>
