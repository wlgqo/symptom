<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - 症候群监测管理系统'">症候群监测管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<div class="app-layout">
    <header class="app-header">
        <div class="header-left">
            <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="切换菜单">
                <svg viewBox="0 0 16 16" width="18" height="18"><path fill="currentColor" d="M2 3h12v1.5H2V3zm0 4.25h12v1.5H2v-1.5zm0 4.25h12V13H2v-1.5z"/></svg>
            </button>
            <div class="header-logo">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#1677ff"/>
                    <path d="M16 7v18M7 16h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="header-system">症候群监测管理系统</h1>
        </div>
        <div class="header-right">
            <span class="header-meta">数据更新：<span th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm')}"></span></span>
            <a href="/warning/center" class="header-badge">
                预警 <span class="badge-count" th:if="${session.pendingWarnings != null}" th:text="${session.pendingWarnings}">0</span>
            </a>
            <span class="header-user" th:text="${session.currentUser.realName}">用户</span>
            <span class="header-role" th:text="${session.currentUser.role}">角色</span>
            <a href="/logout" class="header-logout">退出</a>
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <div class="nav-group expanded" data-group="cockpit">
                    <button type="button" class="nav-group-title" aria-expanded="true">
                        监测驾驶舱
                        <svg class="nav-group-chevron" viewBox="0 0 16 16"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
                    </button>
                    <div class="nav-group-body">
                        <div class="nav-item">
                            <a href="/" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                                <svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M2 2h5v5H2V2zm7 0h5v5H9V2zM2 9h5v5H2V9zm7 0h5v5H9V9z"/></svg>
                                <span>监测驾驶舱</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="nav-group expanded" data-group="syndrome">
                    <button type="button" class="nav-group-title" aria-expanded="true">
                        症候群监测
                        <svg class="nav-group-chevron" viewBox="0 0 16 16"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
                    </button>
                    <div class="nav-group-body">
                        <div class="nav-item">
                            <a href="/respiratory" th:classappend="${activeMenu == 'respiratory' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span>发热呼吸道症候群</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/hemorrhage" th:classappend="${activeMenu == 'hemorrhage' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span>发热伴出血症候群</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/diarrhea" th:classappend="${activeMenu == 'diarrhea' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span>发热伴腹泻症候群</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/rash" th:classappend="${activeMenu == 'rash' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span>发热出疹症候群</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/encephalitis" th:classappend="${activeMenu == 'encephalitis' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span>脑炎脑膜炎症候群</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/fuo" th:classappend="${activeMenu == 'fuo' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span>不明原因发热症候群</span></a>
                        </div>
                    </div>
                </div>

                <div class="nav-group expanded" data-group="warning">
                    <button type="button" class="nav-group-title" aria-expanded="true">
                        预警中心
                        <svg class="nav-group-chevron" viewBox="0 0 16 16"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
                    </button>
                    <div class="nav-group-body">
                        <div class="nav-item">
                            <a href="/warning/center" th:classappend="${activeMenu == 'warning' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.5l6.5 2.5v4c0 3.5-2.5 5.5-6.5 6.5C4 13.5 1.5 11.5 1.5 8V4L8 1.5z"/></svg><span>实时预警</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/warning/model" th:classappend="${activeMenu == 'warning-model' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M3 2h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/></svg><span>预警模型中心</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/event" th:classappend="${activeMenu == 'event' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M2 2h12v2H2V2zm0 4h12v2H2V6zm0 4h8v2H2v-2z"/></svg><span>事件中心</span></a>
                        </div>
                    </div>
                </div>

                <div class="nav-group expanded" data-group="case">
                    <button type="button" class="nav-group-title" aria-expanded="true">
                        病例中心
                        <svg class="nav-group-chevron" viewBox="0 0 16 16"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
                    </button>
                    <div class="nav-group-body">
                        <div class="nav-item">
                            <a href="/case/list" th:classappend="${activeMenu == 'case' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M3 2h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/></svg><span>主动监测病例</span></a>
                        </div>
                    </div>
                </div>

                <div class="nav-group expanded" data-group="analysis">
                    <button type="button" class="nav-group-title" aria-expanded="true">
                        智能分析
                        <svg class="nav-group-chevron" viewBox="0 0 16 16"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
                    </button>
                    <div class="nav-group-body">
                        <div class="nav-item">
                            <a href="/search" th:classappend="${activeMenu == 'analysis' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M11.5 10.5l3 3-.7.7-3-3a5 5 0 1 0-.7-.7l3-3 .7.7zM6 10a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><span>条件树组合分析</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/theme" th:classappend="${activeMenu == 'theme' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3h12v1H2V3zm0 3h8v1H2V6zm0 3h10v1H2V9zm0 3h6v1H2v-1z"/></svg><span>症候群主题库</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="/config" th:classappend="${activeMenu == 'syndrome-config' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.5l1.5 3 3.3.5-2.4 2.3.6 3.3L8 9.2 4 10.6l.6-3.3L2.2 4.5l3.3-.5L8 1.5z"/></svg><span>症候群配置</span></a>
                        </div>
                    </div>
                </div>

                <div class="nav-group expanded" data-group="admin" th:if="${session.currentUser != null and session.currentUser.role == '管理员'}">
                    <button type="button" class="nav-group-title" aria-expanded="true">
                        系统管理
                        <svg class="nav-group-chevron" viewBox="0 0 16 16"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
                    </button>
                    <div class="nav-group-body">
                        <div class="nav-item"><a href="/admin?tab=menu" th:classappend="${activeMenu == 'admin' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M2 2h5v5H2V2zm9 0h5v5h-5V2zM2 9h5v5H2V9zm9 0h5v5h-5V9z"/></svg><span>菜单配置</span></a></div>
                        <div class="nav-item"><a href="/admin?tab=users" th:classappend="${activeMenu == 'admin' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3z"/></svg><span>用户配置</span></a></div>
                        <div class="nav-item"><a href="/admin?tab=roles" th:classappend="${activeMenu == 'admin' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.5l6.5 2.5v4c0 3.5-2.5 5.5-6.5 6.5C4 13.5 1.5 11.5 1.5 8V4L8 1.5z"/></svg><span>角色配置</span></a></div>
                        <div class="nav-item"><a href="/admin?tab=dict" th:classappend="${activeMenu == 'admin' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M3 2h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/></svg><span>字典项配置</span></a></div>
                        <div class="nav-item"><a href="/admin?tab=monitor" th:classappend="${activeMenu == 'admin' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M2 12h12v2H2v-2zm2-3h2V4H4v5zm4 0h2V2H8v7zm4 0h2V6h-2v3z"/></svg><span>系统监控</span></a></div>
                        <div class="nav-item"><a href="/admin?tab=notice" th:classappend="${activeMenu == 'admin' ? 'active' : ''}"><svg class="nav-svg" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3h12v2H2V3zm0 4h8v2H2V7zm0 4h10v2H2v-2z"/></svg><span>通知公告</span></a></div>
                    </div>
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <div class="page-header-bar">
                <div class="page-header-left">
                    <h2 class="page-title" th:text="${pageTitle != null ? pageTitle : '监测驾驶舱'}">页面标题</h2>
                    <div class="breadcrumb" th:if="${breadcrumb != null}">
                        <a href="/">监测驾驶舱</a>
                        <span class="sep">/</span>
                        <span class="current" th:text="${breadcrumb}">当前页</span>
                    </div>
                </div>
            </div>
            <div class="page-content" th:replace="${content}">内容区域</div>
            <footer class="app-footer">
                <span>症候群监测管理系统 SSEW</span>
                <span>© 四川省疾病预防控制中心</span>
            </footer>
        </div>
    </div>
</div>
</body>
</html>
