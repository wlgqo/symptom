<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - 症候群主动监测预警系统'">症候群主动监测预警演示系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">+</div>
            <div>
                <h3>症候群主动监测<br>预警演示系统</h3>
                <small>传染病监测预警平台</small>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">监测总览</div>
            <div class="nav-item"><a href="/" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}"><span class="nav-icon">◉</span><span>首页驾驶舱</span></a></div>

            <div class="nav-section">症候群监测</div>
            <div class="nav-item"><a href="/respiratory" th:classappend="${activeMenu == 'respiratory' ? 'active' : ''}"><span class="nav-icon">◎</span><span>发热呼吸道症候群</span></a></div>
            <div class="nav-item"><a href="/hemorrhage" th:classappend="${activeMenu == 'hemorrhage' ? 'active' : ''}"><span class="nav-icon">◎</span><span>发热伴出血症候群</span></a></div>
            <div class="nav-item"><a href="/diarrhea" th:classappend="${activeMenu == 'diarrhea' ? 'active' : ''}"><span class="nav-icon">◎</span><span>发热伴腹泻症候群</span></a></div>

            <div class="nav-section">数据应用</div>
            <div class="nav-item"><a href="/search" th:classappend="${activeMenu == 'search' ? 'active' : ''}"><span class="nav-icon">◇</span><span>条件树搜索</span></a></div>
            <div class="nav-item"><a href="/case/list" th:classappend="${activeMenu == 'case' ? 'active' : ''}"><span class="nav-icon">▤</span><span>病例管理</span></a></div>

            <div class="nav-section" th:if="${session.currentUser != null and session.currentUser.role == '管理员'}">系统配置</div>
            <div class="nav-item" th:if="${session.currentUser != null and session.currentUser.role == '管理员'}">
                <a href="/admin" th:classappend="${activeMenu == 'admin' ? 'active' : ''}"><span class="nav-icon">⚙</span><span>系统管理</span></a>
            </div>
        </nav>
        <div class="sidebar-footer">v1.0 演示系统</div>
    </aside>
    <div class="main-content">
        <div class="top-bar">
            <div class="top-bar-left">
                <h4 th:text="${pageTitle != null ? pageTitle : '首页驾驶舱'}">页面标题</h4>
                <div class="breadcrumb" th:if="${breadcrumb != null}">
                    <a href="/">首页</a>
                    <span class="sep">/</span>
                    <span class="current" th:text="${breadcrumb}">当前页</span>
                </div>
            </div>
            <div class="user-info">
                <span th:text="${session.currentUser.realName}">用户</span>
                <span class="role-badge" th:text="${session.currentUser.role}">角色</span>
                <a href="/logout" class="logout-link">退出</a>
            </div>
        </div>
        <div class="page-content" th:replace="${content}">内容区域</div>
    </div>
</div>
</body>
</html>
