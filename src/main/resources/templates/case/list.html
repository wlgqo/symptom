<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('主动监测病例管理', ~{::content})}">
<body>
<div th:fragment="content" class="list-page-content">
    <div class="scope-hint" th:if="${scopeDistrict != null or scopeHospital != null}">
        当前数据范围：
        <strong th:if="${scopeDistrict != null}" th:text="${scopeDistrict}">辖区</strong>
        <span th:if="${scopeDistrict != null and scopeHospital != null}"> · </span>
        <strong th:if="${scopeHospital != null}" th:text="${scopeHospital}">机构</strong>
        （业务人员仅可查看所属辖区、机构数据）
    </div>

    <div class="quick-links">
        <a href="/" class="quick-link">监测工作台</a>
        <a href="/respiratory" class="quick-link">呼吸道监测</a>
        <a href="/search" class="quick-link">主题库检索</a>
    </div>

    <form class="search-form" method="get" action="/case/list">
        <div class="form-row">
            <div><label>患者姓名</label><input type="text" name="patientName" th:value="${params.patientName}"></div>
            <div><label>主索引号</label><input type="text" name="mainIndex" th:value="${params.mainIndex}"></div>
            <div><label>性别</label>
                <select name="gender">
                    <option value="">全部</option>
                    <option value="男" th:selected="${params.gender == '男'}">男</option>
                    <option value="女" th:selected="${params.gender == '女'}">女</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <th:block th:replace="~{fragments/region-hospital-filter :: regionHospital(${params.district}, ${params.hospital}, ${districtOptions}, ${hospitalOptions}, ${scopeDistrict}, ${scopeHospital})}"></th:block>
        </div>
        <div class="form-row">
            <div><label>病例类型</label>
                <select name="caseType">
                    <option value="">全部</option>
                    <option value="确诊病例" th:selected="${params.caseType == '确诊病例'}">确诊病例</option>
                    <option value="疑似病例" th:selected="${params.caseType == '疑似病例'}">疑似病例</option>
                </select>
            </div>
            <div><label>症候群类型</label>
                <select name="syndromeType">
                    <option value="">全部</option>
                    <option value="发热呼吸道症候群" th:selected="${params.syndromeType == '发热呼吸道症候群'}">发热呼吸道症候群</option>
                    <option value="发热伴出血症候群" th:selected="${params.syndromeType == '发热伴出血症候群'}">发热伴出血症候群</option>
                    <option value="发热伴腹泻症候群" th:selected="${params.syndromeType == '发热伴腹泻症候群'}">发热伴腹泻症候群</option>
                    <option value="发热出疹症候群" th:selected="${params.syndromeType == '发热出疹症候群'}">发热出疹症候群</option>
                    <option value="脑炎脑膜炎症候群" th:selected="${params.syndromeType == '脑炎脑膜炎症候群'}">脑炎脑膜炎症候群</option>
                    <option value="不明原因发热症候群" th:selected="${params.syndromeType == '不明原因发热症候群'}">不明原因发热症候群</option>
                </select>
            </div>
            <div><label>年龄范围</label>
                <div style="display:flex;gap:4px;">
                    <input type="number" name="ageMin" placeholder="最小" th:value="${params.ageMin}" style="width:50%;">
                    <input type="number" name="ageMax" placeholder="最大" th:value="${params.ageMax}" style="width:50%;">
                </div>
            </div>
            <div><label>病例发现方式</label>
                <select name="discoverType">
                    <option value="">全部</option>
                    <option value="主动监测" th:selected="${params.discoverType == '主动监测'}">主动监测</option>
                    <option value="医院报告" th:selected="${params.discoverType == '医院报告'}">医院报告</option>
                    <option value="社区筛查" th:selected="${params.discoverType == '社区筛查'}">社区筛查</option>
                    <option value="学校报告" th:selected="${params.discoverType == '学校报告'}">学校报告</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <th:block th:replace="~{fragments/date-range :: dateRange(${params.startDate}, ${params.endDate})}"></th:block>
        </div>
        <div>
            <button type="submit" class="btn-primary-custom">查询</button>
            <a href="/case/export" class="btn-outline-custom" style="text-decoration:none;margin-left:8px;">导出数据</a>
        </div>
    </form>

    <div class="card-panel flex-grow">
        <h5>病例列表（共 <span th:text="${pageResult.total}">0</span> 条）</h5>
        <div class="table-scroll-panel">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>主索引号</th><th>姓名</th><th>性别</th><th>年龄</th>
                        <th>症候群类型</th><th>地区</th><th>诊断</th><th>风险等级</th><th>报告日期</th><th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${cases}">
                        <td th:text="${c.mainIndex}"></td>
                        <td th:text="${c.patientName}"></td>
                        <td th:text="${c.gender}"></td>
                        <td th:text="${c.age}"></td>
                        <td th:text="${c.syndromeType}"></td>
                        <td th:text="${c.district}"></td>
                        <td th:text="${c.diagnosis}"></td>
                        <td>
                            <span th:if="${c.riskLevel}"
                                  th:class="${c.riskLevel == '高风险' ? 'badge-level badge-high' : (c.riskLevel == '中风险' ? 'badge-level badge-medium' : 'badge-level badge-low')}"
                                  th:text="${c.riskLevel}"></span>
                        </td>
                        <td th:text="${#dates.format(c.reportDate, 'yyyy-MM-dd')}"></td>
                        <td>
                            <a th:href="@{/case/detail/{id}(id=${c.id})}" class="table-link">原始病历</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination-bar" th:if="${pageResult.total > 0}">
            <span>第 <span th:text="${pageResult.page}">1</span> / <span th:text="${pageResult.totalPages}">1</span> 页</span>
            <div class="pagination-links">
                <a th:if="${pageResult.page > 1}"
                   th:href="@{/case/list(page=${pageResult.page - 1}, pageSize=${pageResult.pageSize}, patientName=${params.patientName}, mainIndex=${params.mainIndex}, gender=${params.gender}, district=${params.district}, hospital=${params.hospital}, caseType=${params.caseType}, syndromeType=${params.syndromeType}, ageMin=${params.ageMin}, ageMax=${params.ageMax}, discoverType=${params.discoverType}, startDate=${params.startDate}, endDate=${params.endDate})}"
                   class="page-link">上一页</a>
                <a th:if="${pageResult.page < pageResult.totalPages}"
                   th:href="@{/case/list(page=${pageResult.page + 1}, pageSize=${pageResult.pageSize}, patientName=${params.patientName}, mainIndex=${params.mainIndex}, gender=${params.gender}, district=${params.district}, hospital=${params.hospital}, caseType=${params.caseType}, syndromeType=${params.syndromeType}, ageMin=${params.ageMin}, ageMax=${params.ageMax}, discoverType=${params.discoverType}, startDate=${params.startDate}, endDate=${params.endDate})}"
                   class="page-link">下一页</a>
            </div>
        </div>
    </div>
    <script th:inline="javascript">window.__hospitalMap = /*[[${hospitalMap}]]*/ {};</script>
</div>
</body>
</html>
