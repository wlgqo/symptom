<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('病例详情', ~{::content})}">
<body>
<div th:fragment="content">
    <div style="margin-bottom:16px;display:flex;gap:8px;">
        <a href="/case/list" class="btn-outline-custom" style="text-decoration:none;">← 返回列表</a>
        <a th:if="${session.currentUser.role != '浏览人员'}" th:href="@{/case/edit/{id}(id=${caseInfo.id})}" class="btn-primary-custom" style="text-decoration:none;">修改病例</a>
    </div>

    <div class="card-panel">
        <h5>基本信息</h5>
        <div class="detail-grid">
            <div class="detail-item"><span class="label">主索引号：</span><span th:text="${caseInfo.mainIndex}"></span></div>
            <div class="detail-item"><span class="label">姓名：</span><span th:text="${caseInfo.patientName}"></span></div>
            <div class="detail-item"><span class="label">性别：</span><span th:text="${caseInfo.gender}"></span></div>
            <div class="detail-item"><span class="label">年龄：</span><span th:text="${caseInfo.age}"></span></div>
            <div class="detail-item"><span class="label">职业：</span><span th:text="${caseInfo.occupation}"></span></div>
            <div class="detail-item"><span class="label">地址：</span><span th:text="${caseInfo.address}"></span></div>
            <div class="detail-item"><span class="label">行政区划：</span><span th:text="${caseInfo.district}"></span></div>
            <div class="detail-item"><span class="label">发现方式：</span><span th:text="${caseInfo.discoverType}"></span></div>
            <div class="detail-item"><span class="label">症候群类型：</span><span th:text="${caseInfo.syndromeType}"></span></div>
            <div class="detail-item"><span class="label">病例类型：</span><span th:text="${caseInfo.caseType}"></span></div>
            <div class="detail-item"><span class="label">诊断：</span><span th:text="${caseInfo.diagnosis}"></span></div>
            <div class="detail-item"><span class="label">转归：</span><span th:text="${caseInfo.outcome}"></span></div>
        </div>
    </div>

    <div class="card-panel" th:if="${!cards.isEmpty()}">
        <h5>关联报卡</h5>
        <table class="data-table">
            <thead><tr><th>报卡编号</th><th>报告类型</th><th>报告日期</th><th>报告人</th><th>状态</th></tr></thead>
            <tbody>
                <tr th:each="card : ${cards}">
                    <td th:text="${card.cardNo}"></td>
                    <td th:text="${card.reportType}"></td>
                    <td th:text="${#dates.format(card.reportDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${card.reporter}"></td>
                    <td th:text="${card.status}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card-panel">
        <h5>修改日志</h5>
        <table class="data-table" th:if="${!logs.isEmpty()}">
            <thead><tr><th>修改时间</th><th>操作人</th><th>修改说明</th></tr></thead>
            <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#dates.format(log.modifyTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td th:text="${log.operator}"></td>
                    <td th:text="${log.changeDesc}"></td>
                </tr>
            </tbody>
        </table>
        <p th:if="${logs.isEmpty()}" style="color:#6c757d;">暂无修改记录</p>
    </div>
</div>
</body>
</html>
