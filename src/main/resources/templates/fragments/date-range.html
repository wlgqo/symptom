<div th:fragment="dateRange(startDate, endDate)" class="date-range-fields">
    <label class="date-label">开始日期</label>
    <input type="date" name="startDate" th:value="${startDate}" class="form-input-date">
    <label class="date-label">结束日期</label>
    <input type="date" name="endDate" th:value="${endDate}" class="form-input-date">
</div>
