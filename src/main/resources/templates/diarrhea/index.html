<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('发热伴腹泻症候群病例风险管理', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="workflow-bar">
        <div class="workflow-step active"><span class="step-num">1</span><span class="step-label">病例采集</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">2</span><span class="step-label">风险评级</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">3</span><span class="step-label">高风险筛查</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">4</span><span class="step-label">原始病历</span></div>
        <span class="workflow-arrow">→</span>
        <div class="workflow-step active"><span class="step-num">5</span><span class="step-label">预警模型</span></div>
    </div>

    <div class="quick-links">
        <a href="/case/list?syndromeType=发热伴腹泻症候群" class="quick-link">全部病例</a>
        <a href="/search" class="quick-link">主题库检索</a>
        <a href="/respiratory" class="quick-link">呼吸道监测</a>
    </div>

    <div class="card-panel" th:if="${syndromeConfig != null}">
        <h5>症候群识别规则 <span class="panel-action"><span class="badge-level badge-blue" th:text="${syndromeConfig.syndromeCode}"></span></span></h5>
        <p class="panel-desc" th:text="${syndromeConfig.definition}"></p>
    </div>

    <div class="stat-cards">
        <div class="stat-card clickable" onclick="location.href='/case/list?syndromeType=发热伴腹泻症候群'">
            <div class="label">病例总数</div>
            <div class="value" th:text="${cases.size()}">0</div>
        </div>
        <div class="stat-card danger">
            <div class="label">高风险病例</div>
            <div class="value" th:text="${highRiskCases.size()}">0</div>
        </div>
        <div class="stat-card warning">
            <div class="label">中风险病例</div>
            <div class="value" th:text="${mediumRiskCount}">0</div>
        </div>
    </div>

    <div class="card-panel" th:if="${!highRiskCases.isEmpty()}">
        <h5>高风险病例快速筛查</h5>
        <table class="data-table">
            <thead><tr><th>姓名</th><th>年龄</th><th>诊断</th><th>风险等级</th><th>风险分析依据</th><th>操作</th></tr></thead>
            <tbody>
                <tr th:each="c : ${highRiskCases}">
                    <td th:text="${c.patientName}"></td>
                    <td th:text="${c.age}"></td>
                    <td th:text="${c.diagnosis}"></td>
                    <td><span class="badge-level badge-high" th:text="${c.riskLevel}"></span></td>
                    <td th:text="${c.riskReason}"></td>
                    <td><a th:href="@{/case/detail/{id}(id=${c.id})}" class="table-link">原始病历</a></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card-panel">
        <h5>全部病例列表</h5>
        <table class="data-table">
            <thead>
                <tr>
                    <th>主索引号</th><th>姓名</th><th>性别</th><th>年龄</th>
                    <th>症状</th><th>诊断</th><th>风险等级</th><th>报告日期</th><th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${cases}">
                    <td th:text="${c.mainIndex}"></td>
                    <td th:text="${c.patientName}"></td>
                    <td th:text="${c.gender}"></td>
                    <td th:text="${c.age}"></td>
                    <td th:text="${c.symptoms != null ? #strings.listJoin(c.symptoms, '、') : ''}"></td>
                    <td th:text="${c.diagnosis}"></td>
                    <td>
                        <span th:class="${c.riskLevel == '高风险' ? 'badge-level badge-high' : (c.riskLevel == '中风险' ? 'badge-level badge-medium' : 'badge-level badge-low')}"
                              th:text="${c.riskLevel}"></span>
                    </td>
                    <td th:text="${#dates.format(c.reportDate, 'yyyy-MM-dd')}"></td>
                    <td><a th:href="@{/case/detail/{id}(id=${c.id})}" class="table-link">原始病历</a></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card-panel" th:if="${models != null and !models.isEmpty()}">
        <h5>风险监测与预警模型</h5>
        <table class="data-table">
            <thead><tr><th>模型名称</th><th>类型</th><th>参数配置</th><th>说明</th><th>状态</th></tr></thead>
            <tbody>
                <tr th:each="m : ${models}">
                    <td th:text="${m.modelName}"></td>
                    <td th:text="${m.modelType}"></td>
                    <td><code style="font-size:11px;" th:text="${m.configJson}"></code></td>
                    <td th:text="${m.description}"></td>
                    <td><span class="badge-level badge-low" th:text="${m.enabled == 1 ? '启用' : '禁用'}"></span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
